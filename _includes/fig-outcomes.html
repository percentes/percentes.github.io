<title id="fig1-title">How a request ends, and what the dashboard records for each</title>
<desc id="fig1-desc">A table drawn as four timelines. Completed: status 200, content events, then the [DONE] marker; the dashboard records a success with its latency. Errored: status 500, a connection reset, or a malformed stream; the dashboard records a failure. Censored: the client gives up at its timeout and what happened is unknown; the dashboard posts no latency for it, so it is absent from the latency percentile. Silently dropped: status 200, no usable content, then the [DONE] marker; the dashboard records a success with its latency, the same as a completion.</desc>

</g>
